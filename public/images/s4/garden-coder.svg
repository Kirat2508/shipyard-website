<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="A builder coding on a laptop on a stone bench in a Roman garden, a small rocket statue on a plinth beside them" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1440" height="900" fill="#f4f0e8"/>
  <!-- sun -->
  <circle cx="1080" cy="250" r="170" fill="#ffd4a8"/>
  <!-- far cypress row -->
  <g fill="#b9c9a3" stroke="#16140f" stroke-width="3">
    <path d="M120 640 C90 520 110 360 150 300 C190 360 210 520 180 640 Z"/>
    <path d="M250 640 C228 540 240 420 270 370 C300 420 312 540 290 640 Z"/>
    <path d="M1270 640 C1240 520 1260 340 1300 280 C1340 340 1360 520 1330 640 Z"/>
    <path d="M1170 640 C1150 560 1160 450 1185 410 C1210 450 1220 560 1200 640 Z"/>
  </g>
  <!-- Roman arch -->
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round">
    <path d="M460 650 L460 330 A260 260 0 0 1 980 330 L980 650 L880 650 L880 340 A160 160 0 0 0 560 340 L560 650 Z" fill="#ddd4c3"/>
    <rect x="430" y="300" width="580" height="30" fill="#ebe5d9"/>
    <rect x="440" y="640" width="140" height="22" fill="#ebe5d9"/>
    <rect x="860" y="640" width="140" height="22" fill="#ebe5d9"/>
  </g>
  <g stroke="#16140f" stroke-width="2" opacity="0.55">
    <line x1="485" y1="345" x2="485" y2="635"/><line x1="510" y1="345" x2="510" y2="635"/><line x1="535" y1="345" x2="535" y2="635"/>
    <line x1="905" y1="345" x2="905" y2="635"/><line x1="930" y1="345" x2="930" y2="635"/><line x1="955" y1="345" x2="955" y2="635"/>
  </g>
  <text x="720" y="322" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="700" letter-spacing="8" fill="#16140f">SHIPYARD · S IV</text>
  <!-- lawn -->
  <path d="M0 640 L1440 640 L1440 900 L0 900 Z" fill="#b9c9a3" stroke="#16140f" stroke-width="3"/>
  <path d="M560 900 L660 640 L780 640 L880 900 Z" fill="#ebe5d9" stroke="#16140f" stroke-width="3"/>
  <g stroke="#16140f" stroke-width="2" opacity="0.5">
    <line x1="640" y1="700" x2="800" y2="700"/><line x1="620" y1="770" x2="820" y2="770"/><line x1="595" y1="850" x2="845" y2="850"/>
  </g>
  <!-- hedges -->
  <g fill="#2f5d3a" stroke="#16140f" stroke-width="3">
    <rect x="0" y="600" width="420" height="80" rx="40"/>
    <rect x="1020" y="600" width="420" height="80" rx="40"/>
  </g>
  <!-- plinth + rocket statue -->
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round">
    <rect x="1040" y="520" width="120" height="200" fill="#ebe5d9"/>
    <rect x="1025" y="505" width="150" height="22" fill="#ddd4c3"/>
    <rect x="1025" y="712" width="150" height="22" fill="#ddd4c3"/>
    <path d="M1100 340 C1128 365 1136 410 1134 470 L1066 470 C1064 410 1072 365 1100 340 Z" fill="#ddd4c3"/>
    <path d="M1066 450 L1048 490 L1048 505 L1068 490 Z" fill="#ddd4c3"/>
    <path d="M1134 450 L1152 490 L1152 505 L1132 490 Z" fill="#ddd4c3"/>
    <circle cx="1100" cy="410" r="13" fill="#ebe5d9"/>
    <rect x="1080" y="470" width="40" height="35" fill="#ddd4c3"/>
  </g>
  <text x="1100" y="625" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="40" font-weight="700" fill="#16140f">IV</text>
  <!-- bench -->
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round">
    <rect x="250" y="700" width="330" height="36" fill="#ddd4c3"/>
    <rect x="275" y="736" width="44" height="70" fill="#ebe5d9"/>
    <rect x="511" y="736" width="44" height="70" fill="#ebe5d9"/>
  </g>
  <!-- builder -->
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M360 700 L350 610 C350 575 375 560 405 560 C435 560 458 578 460 612 L466 700 Z" fill="#ff5a1f"/>
    <path d="M380 700 L370 760 L330 760" fill="none" stroke-width="14" stroke="#16140f"/>
    <path d="M440 700 L470 760 L500 760" fill="none" stroke-width="14" stroke="#16140f"/>
    <circle cx="405" cy="528" r="30" fill="#c58b62"/>
    <path d="M375 520 C378 492 432 488 436 520 C425 508 390 508 375 520 Z" fill="#16140f"/>
    <!-- laptop -->
    <path d="M410 690 L520 690 L540 610 L440 610 Z" fill="#16140f"/>
    <path d="M452 622 L528 622 L514 678 L438 678 Z" fill="#d4ff3a" stroke="none"/>
    <line x1="400" y1="692" x2="530" y2="692" stroke-width="6"/>
    <path d="M440 640 C452 650 456 664 446 680" fill="none" stroke="#c58b62" stroke-width="12"/>
  </g>
  <!-- floating code glyphs -->
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="26" fill="#16140f">
    <text x="560" y="560">&lt;/&gt;</text>
    <text x="600" y="500" opacity="0.6">{ }</text>
    <text x="520" y="470" opacity="0.4">ship()</text>
  </g>
  <!-- urns -->
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round">
    <path d="M150 740 L210 740 L200 800 L160 800 Z" fill="#ddd4c3"/>
    <circle cx="180" cy="715" r="34" fill="#2f5d3a"/>
    <path d="M1240 740 L1300 740 L1290 800 L1250 800 Z" fill="#ddd4c3"/>
    <circle cx="1270" cy="715" r="34" fill="#2f5d3a"/>
  </g>
</svg>
